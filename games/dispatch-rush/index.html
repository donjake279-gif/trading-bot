<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a big glowing blue city map fills the screen. Vehicles sit on it as clickable tiles.
   Emergencies list on the left, fleet on the right, selection bar at the bottom. */
:root{
  --bg:#0a1540;
  --panel:rgba(9,18,52,.9);
  --panel-2:#0f1d55;
  --line:#22357a;
  --line-2:#33499a;
  --text:#e6eeff;
  --muted:#8fa3d6;
  --dim:#5f74ad;
  --amber:#ffb020;
  --amber-ink:#1c1303;
  --teal:#3fe0c5;
  --pink:#ff5ad2;
  --police:#3fc6ff;
  --fire:#ff5a4a;
  --med:#f2f6ff;
  --medc:#ff4d6a;
  --ok:#53e08a;
  --warn:#ffb020;
  --bad:#ff4d5e;
  --f-display:'Chakra Petch','Barlow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --top:72px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
#map.hand{cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,4,20,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lbl{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ico{width:14px;height:14px;display:inline-block;vertical-align:-2px;fill:currentColor;flex:none}
.cP{color:var(--police)}.cF{color:var(--fire)}.cM{color:var(--medc)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* top bar */
#top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px;z-index:5}
.brand{display:flex;align-items:center;gap:9px;padding-right:6px}
.badge911{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--amber);color:var(--amber-ink);border-radius:6px;padding:3px 7px;letter-spacing:.04em}
.brand b{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.08em}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:-2px}
.seg{display:flex;flex-direction:column;gap:1px;padding:0 10px;border-left:1px solid var(--line)}
.seg .v{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.shift{width:90px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.shift i{display:block;height:100%;background:var(--amber);width:0}
.rep{width:96px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.rep i{display:block;height:100%;width:60%;background:var(--ok);transition:width .3s,background .3s}
#tStreak{color:var(--amber)}
.ctrls{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.05em;color:var(--text);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tb:hover{border-color:var(--muted)}
.tb.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.tb.shop{background:var(--teal);color:#032019;border-color:var(--teal)}
.tb.wave{border-color:#2b7a5a;color:var(--ok)}
.tb.wave.on{background:var(--ok);color:#03150a;border-color:var(--ok)}
.tb:disabled{opacity:.45;cursor:default}
.tb.mtab{display:none}

/* side panels */
#left,#right{position:absolute;top:var(--top);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;z-index:3;min-height:0}
#left{left:max(12px,env(safe-area-inset-left,0px));width:290px}
#right{right:max(12px,env(safe-area-inset-right,0px));width:240px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:11px 12px 8px}
.ph .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scroll{overflow-y:auto;min-height:0;padding:0 8px 8px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#incList{flex:1;display:flex;flex-direction:column;gap:6px}
.empty{color:var(--dim);font-size:13px;padding:10px 6px;line-height:1.45}
.inc{display:grid;grid-template-columns:30px 1fr;gap:3px 9px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:8px 9px 9px;cursor:pointer;width:100%}
.inc:hover{border-color:var(--line-2);border-left-color:var(--c)}
.inc.sel{border-color:var(--amber);border-left-color:var(--c);background:#16286a}
.inc.done{opacity:.55}
.inc .ic{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.inc .ic .ico{width:16px;height:16px}
.inc .t{font-weight:600;font-size:14px;line-height:1.2;display:flex;justify-content:space-between;gap:6px;min-width:0}
.inc .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inc .q{grid-column:1/-1;font-size:12px;color:#c3d0f5;font-style:italic;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.inc .bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.inc .bar i{display:block;height:100%}
.needs{display:flex;gap:5px;flex-wrap:wrap;grid-column:1/-1}
.nd{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px;padding:1px 6px 1px 4px;border-radius:999px;background:#0a1645;border:1px solid var(--line)}
.nd.ok{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.stt{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap;align-self:flex-start}
.stt.open{color:var(--warn);background:rgba(255,176,32,.12)}
.stt.working{color:var(--ok);background:rgba(83,224,138,.12)}
.stt.chase{color:var(--bad);background:rgba(255,77,94,.14)}
.stt.done{color:var(--ok)}.stt.failed{color:var(--bad)}
#radio{height:150px;flex:none;border-top:1px solid var(--line);font-size:12px;line-height:1.4;display:flex;flex-direction:column;gap:5px;padding-top:8px}
#radio .r{color:var(--muted)}
#radio .r b{color:var(--text);font-weight:600}
#radio .r .tm{font-family:var(--f-mono);color:var(--dim);font-size:11px;margin-right:5px}
#unitList{display:flex;flex-direction:column;gap:3px}
.ug{margin:8px 4px 3px;display:flex;align-items:center;gap:6px}
.ur{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;background:transparent;border:1px solid transparent;width:100%;text-align:left}
.ur:hover{background:var(--panel-2);border-color:var(--line)}
.ur.sel{border-color:var(--pink);background:rgba(255,90,210,.08)}
.dot{width:12px;height:9px;border-radius:3px;flex:none}
.dot.P{background:var(--police)}.dot.F{background:var(--fire)}.dot.M{background:var(--med);box-shadow:inset 0 0 0 2px var(--medc)}
.ur .nm{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.us{font-family:var(--f-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.us.idle{color:var(--ok);background:rgba(83,224,138,.1)}
.us.enroute{color:var(--amber);background:rgba(255,176,32,.12)}
.us.onscene{color:#ff8ab0;background:rgba(255,77,94,.12)}
.us.returning{color:var(--muted);background:rgba(143,163,214,.12)}

/* incident detail */
#incPanel{position:absolute;top:var(--top);right:calc(max(12px,env(safe-area-inset-right,0px)) + 252px);width:330px;max-height:calc(100% - var(--top) - 90px);display:flex;flex-direction:column;z-index:4}
#incPanel .scroll{padding:0 12px 12px}
.ip-h{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 6px}
.ip-h .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.ip-h .ic .ico{width:19px;height:19px}
.ip-h h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.15;text-wrap:balance}
.ip-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.x{margin-left:auto;background:none;border:1px solid var(--line-2);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--muted);flex:none}
.x:hover{color:var(--text)}
.quote{font-style:italic;color:#c9d6fb;background:#0b184c;border-left:3px solid var(--line-2);border-radius:6px;padding:7px 10px;margin:4px 0 8px;line-height:1.4;font-size:13px}
.ip-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.ip-bar i{display:block;height:100%}
.ip-st{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ip-needs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.need{flex:1;min-width:84px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:2px}
.need .k{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
.need .v{font-family:var(--f-mono);font-size:16px;font-weight:600}
.need.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.full{width:100%}
.kbd{font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;opacity:.7}
.sec{margin:12px 0 5px}
.urow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .nm{flex:1;min-width:0;font-weight:500}
.urow .eta{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.sbtn{border:1px solid var(--line-2);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:12px}
.sbtn.go{border-color:var(--amber);color:var(--amber)}
.sbtn.go:hover{background:var(--amber);color:var(--amber-ink)}
.sbtn:disabled{opacity:.4;cursor:default}

/* bottom selection bar */
#selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:9px 10px 9px 14px;max-width:calc(100% - 32px);font-size:14px}
#selbar.tip{background:rgba(9,18,52,.7);color:var(--muted);font-size:13px;padding:8px 14px}
#selbar.armed{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 0 24px rgba(255,90,210,.35)}
#selbar .who{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}

/* toasts */
#toasts{position:absolute;top:var(--top);left:calc(max(12px,env(safe-area-inset-left,0px)) + 304px);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--k);border-radius:8px;padding:8px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,4,20,.45);animation:pop .2s ease-out;width:100%}
.toast b{display:block;font-size:14px}
.toast span{color:var(--muted)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}

/* overlays */
#ov{position:absolute;inset:0;z-index:10;background:rgba(4,9,30,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto;display:flex;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{margin:auto;width:min(820px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:28px;box-shadow:0 30px 80px rgba(0,4,20,.6)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,8vw,72px);line-height:.92;letter-spacing:.02em;margin:10px 0 6px}
.big em{font-style:normal;color:var(--amber)}
.tag{color:var(--muted);font-size:15px;margin:0 0 20px;max-width:60ch;line-height:1.5}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 22px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.45;color:var(--muted);counter-increment:s}
.how li::before{content:"Step " counter(s);display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.how li b{color:var(--text)}
.keys{font-size:12px;color:var(--dim);margin-top:16px;line-height:1.7}
.keys .kbd{opacity:1;color:var(--muted);margin:0 2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn.lg{padding:12px 20px;font-size:15px;font-family:var(--f-display);letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0}
.st{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st .k{font-size:11px;color:var(--muted);font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.st .v{font-family:var(--f-mono);font-size:22px;font-weight:600;margin-top:2px}
.grade{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;color:var(--amber);float:right;margin-left:12px}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0 18px}
.dc{border-radius:10px;padding:10px;border:1px solid var(--line);background:#0b1745;display:flex;flex-direction:column;gap:5px;min-height:96px;min-width:0}
.dc.own{background:linear-gradient(160deg,#18307a,#112360);border-color:var(--teal)}
.dc.buy{border-color:var(--amber);border-style:dashed}
.dc h4{margin:0;font-size:14px;display:flex;gap:6px;align-items:center;min-width:0}
.dc p{margin:0;font-size:12px;color:var(--muted);line-height:1.35;flex:1}
.dc .tagx{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:8px 0 20px}
.item{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.item h4{margin:0;font-size:15px;display:flex;gap:7px;align-items:center}
.item p{margin:0;font-size:13px;color:var(--muted);line-height:1.4;flex:1}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px}
.own{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
h2{font-family:var(--f-display);font-size:28px;margin:0 0 4px;text-wrap:balance}
h3.s{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.money{font-family:var(--f-mono);color:var(--amber)}

@media (max-width:900px){
  #top{gap:6px;padding:6px 8px}
  .brand small,.seg.hide-n{display:none}
  .seg{padding:0 7px}
  .seg .v{font-size:13px}
  .rep,.shift{width:64px}
  .tb{padding:5px 8px}
  .tb.mtab{display:inline-flex}
  #left,#right{display:none;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:auto;max-height:55%}
  body.show-left #left,body.show-right #right{display:flex}
  #incPanel{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:46%}
  #toasts{left:50%;transform:translateX(-50%)}
  .card{padding:20px}
  .dgrid{gap:4px}
  .dc{padding:7px;min-height:84px}
  .dc p{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="map" aria-label="City map"></canvas>

  <header id="top" class="panel">
    <div class="brand"><span class="badge911">911</span><div><b>DISPATCH RUSH</b><small>Ashford Emergency Services</small></div></div>
    <div class="seg"><span class="lbl">Day</span><span class="v" id="tDay">1</span></div>
    <div class="seg"><span class="lbl">Shift</span><span class="v" id="tClock">08:00</span><div class="shift"><i id="tShift"></i></div></div>
    <div class="seg"><span class="lbl">Budget</span><span class="v" id="tMoney">$0</span></div>
    <div class="seg"><span class="lbl">Reputation</span><span class="v" id="tRepN">60</span><div class="rep"><i id="tRep"></i></div></div>
    <div class="seg hide-n"><span class="lbl">Streak</span><span class="v" id="tStreak">×1</span></div>
    <div class="ctrls">
      <button class="tb mtab" id="mtL" type="button">Emergencies</button>
      <button class="tb mtab" id="mtR" type="button">Fleet</button>
      <button class="tb shop" id="bShop" type="button" title="Buy vehicles, upgrades and new districts (B)">City shop</button>
      <button class="tb wave" id="bWave" type="button" title="Every light turns green: vehicles drive 60% faster (G)">Green wave</button>
      <button class="tb" id="bPause" type="button" title="Pause (P)">Pause</button>
      <button class="tb on" data-speed="1" type="button">1×</button>
      <button class="tb" data-speed="2" type="button">2×</button>
      <button class="tb" data-speed="3" type="button">3×</button>
      <button class="tb" id="bMute" type="button">Sound on</button>
    </div>
  </header>

  <aside id="left" class="panel">
    <div class="ph"><span class="lbl">911 emergencies</span><span class="n" id="incN">0</span></div>
    <div class="scroll" id="incList"></div>
    <div class="scroll" id="radio"></div>
  </aside>

  <aside id="right" class="panel">
    <div class="ph"><span class="lbl">Fleet</span><span class="n" id="unitN">0</span></div>
    <div class="scroll" id="unitList"></div>
  </aside>

  <section id="incPanel" class="panel" hidden></section>
  <div id="selbar" class="panel tip" hidden></div>
  <div id="toasts"></div>
  <div id="ov"></div>
</div>

<script>
'use strict';
/* =====================================================================
   DISPATCH RUSH: run Ashford's 911 dispatch from a live city map
   ===================================================================== */
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------------------------------------------------------------
   CITY GENERATION: warped street grid, winding river, parks, 9 districts
   --------------------------------------------------------------------- */
const W=3600,H=2400,COLS=40,ROWS=27,RW=40;
const R=mulberry32(911);
const riverY=x=>H*.53+150*Math.sin(x/640+.4)+55*Math.sin(x/250+2.1);
const side=(x,y)=>y>riverY(x)?1:-1;
const DW=W/3,DH=H/3;
const DISTRICTS=[
 {name:'Old Harbor',st:'F',style:'old',blurb:'Docks, fish markets and very old wiring.'},
 {name:'Uptown',st:'P',style:'down',blurb:'Fancy towers, fancy problems.'},
 {name:'University',st:'M',style:'sub',blurb:'Students, labs and questionable experiments.'},
 {name:'Riverside',st:'M',style:'mid',blurb:'Busy bridges and riverside cafés.'},
 {name:'Downtown',st:null,style:'down',blurb:'Where it all starts. Your headquarters.'},
 {name:'Midtown',st:'F',style:'mid',blurb:'Restaurants, bars and a lot of grease fires.'},
 {name:'Maple Hill',st:'P',style:'sub',blurb:'Quiet suburbs. Too quiet. Raccoons.'},
 {name:'Ironworks',st:'F',style:'iron',blurb:'Factories, warehouses and chemical drums.'},
 {name:'Eastgate',st:'P',style:'sub',blurb:'Malls, a petting zoo and one very fast llama.'}];
const distOf=(x,y)=>clamp(Math.floor(y/DH),0,2)*3+clamp(Math.floor(x/DW),0,2);
const ROWN=['North Ring','Elm St','Oak St','Pine St','Cedar St','Maple St','Birch St','Ash St','Willow St','Cherry St','Laurel St','Hazel St','Juniper St','Aspen St','Spruce St','Poplar St','Magnolia St','Hawthorn St','Holly St','Linden St','Sycamore St','Cypress St','Alder St','Rowan St','Beech St','Chestnut St','South Ring'];
const nodes=[];const nid=(r,c)=>r*COLS+c;
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const bx=40+c*(W-80)/(COLS-1),by=40+r*(H-80)/(ROWS-1);let x=bx,y=by;
  if(c>0&&c<COLS-1)x+=22*Math.sin(by/300+1.3)+14*Math.sin((bx+by)/410)+(R()-.5)*12;
  if(r>0&&r<ROWS-1){y+=22*Math.sin(bx/340+.7)+14*Math.cos((bx-by)/370)+(R()-.5)*12;const d=y-riverY(x);if(Math.abs(d)<RW+16)y=riverY(x)+(d>=0?1:-1)*(RW+16);}
  nodes.push({id:nid(r,c),r,c,x,y,adj:[],alive:false});
}
let edges=[];
(function(){
  const all=[];
  const crosses=(A,B)=>{if(side(A.x,A.y)!==side(B.x,B.y))return true;for(let i=1;i<8;i++){const t=i/8,x=A.x+(B.x-A.x)*t,y=A.y+(B.y-A.y)*t;if(Math.abs(y-riverY(x))<RW+3)return true;}return false;};
  const add=(a,b,kind)=>{const A=nodes[a],B=nodes[b];let bridge=false;
    if(crosses(A,B)){if(kind==='v'&&A.c%6===3&&side(A.x,A.y)!==side(B.x,B.y))bridge=true;else return;}
    all.push({a,b,kind,r:A.r,c:A.c,len:Math.hypot(B.x-A.x,B.y-A.y),bridge});};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-1;c++)add(nid(r,c),nid(r,c+1),'h');
  for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS;c++)add(nid(r,c),nid(r+1,c),'v');
  for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS-1;c++)if(R()<.05){if(R()<.5)add(nid(r,c),nid(r+1,c+1),'d');else add(nid(r,c+1),nid(r+1,c),'d');}
  const alive=all.map(()=>true),adj=nodes.map(()=>[]);
  all.forEach((e,i)=>{adj[e.a].push(i);adj[e.b].push(i);});
  const start=nid(Math.floor(ROWS/4),Math.floor(COLS/2));
  const comp=()=>{const seen=new Uint8Array(nodes.length);const st=[start];seen[start]=1;let n=1;
    while(st.length){const u=st.pop();for(const i of adj[u]){if(!alive[i])continue;const e=all[i],v=e.a===u?e.b:e.a;if(!seen[v]){seen[v]=1;n++;st.push(v);}}}return{seen,n};};
  let base=comp();
  const deg=nodes.map((_,n)=>adj[n].filter(i=>alive[i]).length);
  const order=all.map((_,i)=>i).sort(()=>R()-.5);
  for(const i of order){
    const e=all[i];
    if(e.bridge||R()>.13)continue;
    if((e.kind==='h'&&(e.r===0||e.r===ROWS-1))||(e.kind==='v'&&(e.c===0||e.c===COLS-1)))continue;
    if(deg[e.a]<=2||deg[e.b]<=2)continue;
    alive[i]=false;
    if(comp().n<base.n)alive[i]=true;else{deg[e.a]--;deg[e.b]--;}
  }
  base=comp();
  edges=all.filter((e,i)=>alive[i]&&base.seen[e.a]&&base.seen[e.b]);
  edges.forEach((e,i)=>{
    e.id=i;
    e.major=(e.kind==='h'&&(e.r%6===2||e.r===0||e.r===ROWS-1))||(e.kind==='v'&&(e.c%7===3||e.c===0||e.c===COLS-1))||e.bridge;
    nodes[e.a].adj.push(e);nodes[e.b].adj.push(e);nodes[e.a].alive=nodes[e.b].alive=true;
    const A=nodes[e.a],B=nodes[e.b];
    e.bx0=Math.min(A.x,B.x);e.bx1=Math.max(A.x,B.x);e.by0=Math.min(A.y,B.y);e.by1=Math.max(A.y,B.y);
    e.d=distOf((A.x+B.x)/2,(A.y+B.y)/2);
  });
})();
const other=(e,n)=>e.a===n?e.b:e.a;
const lp=(e,t)=>{const A=nodes[e.a],B=nodes[e.b];return{x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t};};
const locPt=l=>l.e?lp(l.e,l.t):{x:nodes[l.node].x,y:nodes[l.node].y};
const edgeName=e=>e.kind==='h'?ROWN[e.r]:e.kind==='v'?`${ordinal(e.c+1)} Ave`:`${ROWN[e.r].replace(/ (St|Ring)$/,'')} Crescent`;
function addrOf(l){
  const e=l.e,n=(e.kind==='v'?e.r:e.c)*100+2*Math.round(l.t*48)+(e.kind==='h'?1:2);
  return`${n} ${edgeName(e)}`;
}
function nearestNode(x,y,avoid){let b=-1,bd=1e9;for(const n of nodes){if(!n.alive||(avoid&&avoid.has(n.id)))continue;const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;b=n.id;}}return b;}

/* cells: blocks of buildings, parks and ponds */
const cells=[];
(function(){
  for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS-1;c++){
    const A=nodes[nid(r,c)],B=nodes[nid(r,c+1)],C=nodes[nid(r+1,c+1)],D=nodes[nid(r+1,c)];
    const cx=(A.x+B.x+C.x+D.x)/4,cy=(A.y+B.y+C.y+D.y)/4;
    if(Math.abs(cy-riverY(cx))<RW+10)continue;
    const d=distOf(cx,cy),st=DISTRICTS[d].style;
    const pn=Math.sin(cx/520+.5)*Math.sin(cy/470+1.7)+.35*Math.sin(cx/190+cy/230);
    const park=st!=='iron'&&(pn>.78||R()<.035);
    const P=(u,v)=>{const tx=A.x+(B.x-A.x)*u,ty=A.y+(B.y-A.y)*u,bx=D.x+(C.x-D.x)*u,by=D.y+(C.y-D.y)*u;return[tx+(bx-tx)*v,ty+(by-ty)*v];};
    const cell={q:[[A.x,A.y],[B.x,B.y],[C.x,C.y],[D.x,D.y]],park,st,lots:[],pond:null,d,
      bx0:Math.min(A.x,B.x,C.x,D.x),bx1:Math.max(A.x,B.x,C.x,D.x),by0:Math.min(A.y,B.y,C.y,D.y),by1:Math.max(A.y,B.y,C.y,D.y)};
    if(park){if(R()<.3)cell.pond={x:cx+(R()-.5)*20,y:cy+(R()-.5)*20,rx:14+R()*14,ry:10+R()*10,rot:R()*3};}
    else{
      const m=.1,split=n=>{const a=[m];for(let i=1;i<n;i++)a.push(m+(1-2*m)*(i/n)+(R()-.5)*.08);a.push(1-m);return a;};
      let [nu,nv]={down:[3,3],mid:[2,3],old:[3,2],iron:[1,2],sub:[3,3]}[st];
      if(R()<.5)[nu,nv]=[nv,nu];
      const us=split(nu),vs=split(nv),g=st==='down'?.02:.028;
      for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
        let u0=us[i]+g,u1=us[i+1]-g,v0=vs[j]+g,v1=vs[j+1]-g;
        if(st==='sub'){const cu=(u0+u1)/2,cv=(v0+v1)/2,hu=(u1-u0)*(.26+R()*.12),hv=(v1-v0)*(.26+R()*.12);u0=cu-hu;u1=cu+hu;v0=cv-hv;v1=cv+hv;}
        if(st!=='down'&&R()<.06)continue;
        cell.lots.push([P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)]);
      }
    }
    cells.push(cell);
  }
})();
const labels=[];
for(const e of edges){
  if(!e.major||e.bridge)continue;
  if(!((e.kind==='h'&&e.c%5===2)||(e.kind==='v'&&e.r%4===1)))continue;
  const A=nodes[e.a],B=nodes[e.b];let ang=Math.atan2(B.y-A.y,B.x-A.x);
  if(ang>Math.PI/2)ang-=Math.PI;if(ang<-Math.PI/2)ang+=Math.PI;
  labels.push({x:(A.x+B.x)/2,y:(A.y+B.y)/2,ang,text:edgeName(e).toUpperCase()});
}

/* stations: Downtown starts with all three; every other district brings one */
const stations=[];
(function(){
  const used=new Set();
  const add=(type,x,y,name,d)=>{const n=nearestNode(x,y,used);used.add(n);stations.push({id:stations.length,type,node:n,name,d,x:nodes[n].x,y:nodes[n].y});};
  add('P',1500,950,'Police HQ',4);
  add('F',2100,1010,'Fire Station 1',4);
  add('M',1800,1480,'St. Mercy Hospital',4);
  const nm={P:'Precinct',F:'Fire Station',M:'Hospital'};
  DISTRICTS.forEach((D,d)=>{if(!D.st)return;const dx=d%3,dy=Math.floor(d/3);
    let x=dx*DW+DW*.5,y=dy*DH+DH*.5;if(Math.abs(y-riverY(x))<160)y+=y<riverY(x)?-130:130;
    add(D.st,x,y,`${D.name} ${nm[D.st]}`,d);});
})();

/* shortest paths: binary-heap Dijkstra, cached per source node */
const DIJ=new Map();
function dij(src){
  if(DIJ.has(src))return DIJ.get(src);
  const N=nodes.length,d=new Float64Array(N).fill(Infinity),prev=new Int32Array(N).fill(-1);
  const hn=[],hd=[];
  const swap=(i,j)=>{[hn[i],hn[j]]=[hn[j],hn[i]];[hd[i],hd[j]]=[hd[j],hd[i]];};
  const push=(n,v)=>{hn.push(n);hd.push(v);let i=hn.length-1;while(i>0){const p=(i-1)>>1;if(hd[p]<=hd[i])break;swap(p,i);i=p;}};
  const pop=()=>{const n=hn[0],v=hd[0],ln=hn.pop(),lv=hd.pop();if(hn.length){hn[0]=ln;hd[0]=lv;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<hn.length&&hd[l]<hd[m])m=l;if(r<hn.length&&hd[r]<hd[m])m=r;if(m===i)break;swap(m,i);i=m;}}return[n,v];};
  d[src]=0;push(src,0);
  while(hn.length){const [u,du]=pop();if(du>d[u])continue;for(const e of nodes[u].adj){const v=other(e,u),nd=du+e.len;if(nd<d[v]){d[v]=nd;prev[v]=u;push(v,nd);}}}
  const r={d,prev};DIJ.set(src,r);return r;
}
function planRoute(from,to){
  const S0=from.e?[{n:from.e.a,c:from.t*from.e.len},{n:from.e.b,c:(1-from.t)*from.e.len}]:[{n:from.node,c:0}];
  const E0=to.e?[{n:to.e.a,c:to.t*to.e.len},{n:to.e.b,c:(1-to.t)*to.e.len}]:[{n:to.node,c:0}];
  const tp=locPt(to);let best={cost:Infinity,pts:[]};
  if(from.e&&to.e&&from.e===to.e)best={cost:Math.abs(from.t-to.t)*to.e.len,pts:[{x:tp.x,y:tp.y,loc:to}]};
  for(const s of S0){const D=dij(s.n);for(const en of E0){const c=s.c+D.d[en.n]+en.c;if(c<best.cost){
    const np=[];for(let v=en.n;v!==-1;v=D.prev[v])np.push(v);np.reverse();
    const pts=np.map(v=>({x:nodes[v].x,y:nodes[v].y,loc:{node:v}}));
    if(to.e)pts.push({x:tp.x,y:tp.y,loc:to});best={cost:c,pts};}}}
  return best;
}

function update(dt){

  if(S.wave.on>0)S.wave.on-=g;
  if(S.wave.cd>0)S.wave.cd-=g;
  S.nextCall-=g;

    const lo=Math.max(4.5,(17-1.3*S.day)/(1+.3*(nd-1)));

    ctx.save();ctx.translate(x-r*.5,y-r*.5);ctx.scale(r/24,r/24);ctx.fillStyle='#ffffff';ctx.fill(PATHS[st.type]);ctx.restore();
    if(z>.32){ctx.font='600 11px Barlow, sans-serif';ctx.textAlign='center';ctx.textBaseline='top';const w=ctx.measureText(st.name).width+10;ctx.fillStyle='rgba(6,14,44,.8)';rr(x-w/2,y+r+3,w,15,4);ctx.fill();ctx.fillStyle='#cfe0ff';ctx.fillText(st.name,x,y+r+5);}

  }
  for(const p of S.parts){const a=p.life/p.max,r=p.r*clamp(z,.6,1.6);ctx.fillStyle=p.ember?`rgba(255,${150+(1-a)*80|0},70,${a})`:`rgba(170,180,210,${a*.25})`;ctx.beginPath();ctx.arc(X(p.x),Y(p.y),r,0,7);ctx.fill();}
  // incidents

    if(S.sel===inc.id||hv||target||z>.85||!live(inc)){

      ctx.font='600 12px Barlow, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';

  // suspects
  const tw=tileW(),th=tileH();
  for(const s of S.suspects){

let lastSig={};
function setHTML(el,html,key){if(lastSig[key]===html)return;lastSig[key]=html;el.innerHTML=html;}
const barCol=f=>f>.5?'var(--ok)':f>.25?'var(--warn)':'var(--bad)';
function needsChips(inc){
  const have=counts(inc,['enroute','onscene']),out=[];
  for(const t of ['P','F','M'])if(inc.known[t]>0)out.push(`<span class="nd ${have[t]>=inc.known[t]?'ok':''}"><span class="c${t}">${svg(t)}</span>${have[t]}/${inc.known[t]}</span>`);

}
function statusOf(inc){
  if(inc.status==='done')return['done','Resolved'];
  if(inc.status==='failed')return['failed','Failed'];
  if(inc.chase&&!inc.chase.caught)return['chase','Pursuit'];
  if(inc.status==='working')return['working','Working'];
  return['open','Waiting'];
}

function renderInc(){

function toast(title,sub,kind='info',ms=3600){
  const box=$('#toasts');while(box.children.length>=4)box.firstChild.remove();
  const k={ok:'var(--ok)',bad:'var(--bad)',warn:'var(--warn)',hint:'var(--teal)',call:'var(--pink)',info:'var(--line-2)'}[kind]||'var(--line-2)';
  const d=document.createElement('div');d.className='toast';d.style.setProperty('--k',k);
  d.innerHTML=`<b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}`;box.appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),320);},ms);
}
function onAct(root,fn){
  root.addEventListener('pointerdown',e=>{if(e.button!==0)return;const b=e.target.closest('[data-act]');if(!b||b.disabled||!root.contains(b))return;e.preventDefault();audioOn();fn(b.dataset.act,b.dataset.arg);});
  root.addEventListener('click',e=>{if(e.detail!==0)return;const b=e.target.closest('[data-act]');if(!b||b.disabled)return;fn(b.dataset.act,b.dataset.arg);});
}
function selectUnit(u,center){
  S.selU=u?u.id:null;
  if(u){sfx.pick();if(center){const p=u.state==='idle'?stations[u.home]:u;centerOn(p.x,p.y);}}
  renderUI(true);
}
function act(a,arg){
  if(!S||mode!=='play')return;
  if(a==='sel'){
    const inc=incById(+arg),u=S.selU&&unitById(S.selU);
    if(u&&inc&&canSend(u,inc)){dispatch(u,inc);S.selU=null;}
    select(+arg,true);document.body.classList.remove('show-left');
  }
  else if(a==='close')select(null);
  else if(a==='rec')sendRecommended();
  else if(a==='send1'){const u=unitById(arg),inc=incById(S.sel);if(u&&inc){dispatch(u,inc);renderUI(true);}}
  else if(a==='recall'){const u=unitById(arg);if(u){recall(u);renderUI(true);}}
  else if(a==='unit'){const u=unitById(arg);if(u){const inc=S.sel&&incById(S.sel);if(inc&&canSend(u,inc)){dispatch(u,inc);renderUI(true);}else selectUnit(S.selU===u.id?null:u,true);document.body.classList.remove('show-right');}}
  else if(a==='unsel')selectUnit(null);
}
['#incList','#unitList','#incPanel','#selbar'].forEach(s=>onAct($(s),act));

 {id:'F',name:'Fire engine',icon:'F',desc:'Slower, but nothing else can fight fires.',cost:()=>2200,can:()=>meta.fleet.F<10,own:()=>`${meta.fleet.F} owned`,buy:()=>{meta.fleet.F++;addUnit('F');}},
 {id:'H',name:'Police helicopter',icon:'heli',desc:'Flies straight over the city. Chases end fast.',cost:()=>5000,can:()=>meta.fleet.H<2,own:()=>`${meta.fleet.H}/2 owned`,buy:()=>{meta.fleet.H++;addUnit('P',true);}},
 {id:'engine',name:'Engine tune-up',icon:'bolt',desc:'Every vehicle drives 12% faster.',cost:()=>2000*(meta.up.engine+1),can:()=>meta.up.engine<3,own:()=>`Level ${meta.up.engine}/3`,buy:()=>meta.up.engine++},
 {id:'patience',name:'First-aid hotline',icon:'M',desc:'Callers get coached while they wait: +12s on every emergency timer.',cost:()=>1600*(meta.up.patience+1),can:()=>meta.up.patience<3,own:()=>`Level ${meta.up.patience}/3`,buy:()=>meta.up.patience++},
 {id:'wave',name:'Green Wave+',icon:'bolt',desc:'Green wave lasts 16s instead of 10 and recharges in 35s.',cost:()=>1500,can:()=>!meta.up.wave,own:()=>meta.up.wave?'Owned':'',buy:()=>meta.up.wave=1},
];
function addUnit(type,heli){if(!S||mode==='summary')return;const st=heli?activeStations('P')[0]:homeFor(type);S.units.push(mkUnit(type,!!heli,st));}
function buyDistrict(d){
  if(!canBuyD(d)||meta.money<priceD())return false;
  meta.money-=priceD();meta.districts.push(d);
  const D=DISTRICTS[d];
  if(D.st){meta.fleet[D.st]++;if(S&&mode!=='summary'){const st=stations.find(s=>s.d===d);S.units.push(mkUnit(D.st,false,st));}}
  saveMeta();sfx.buy();
  toast(`${D.name} unlocked!`,`New ${D.st==='P'?'police precinct':D.st==='F'?'fire station':'hospital'} and a free vehicle. More 911 calls, more money.`,'ok',5000);
  if(S)radio('City Hall',`${D.name} joins the Ashford emergency network.`);
  return true;
}
const ov=$('#ov');
let ovRender=null;
function hideOv(){ov.hidden=true;ov.innerHTML='';ovRender=null;}
function shopHTML(){
  const pd=priceD();
  return`<h3 class="s">Districts · next one costs <span class="money">$${pd.toLocaleString()}</span></h3>
  <div class="dgrid">${DISTRICTS.map((D,d)=>{
    const o=owned(d),can=canBuyD(d);
    return`<div class="dc ${o?'own':can?'buy':''}"><h4>${o?svg('map','cP'):svg('lock')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${D.name}</span></h4><p>${D.blurb}</p>
      ${o?`<span class="tagx">Owned</span>`:can?`<button class="sbtn go" type="button" data-buyd="${d}" ${meta.money<pd?'disabled':''}>Unlock $${pd.toLocaleString()}</button>`:`<span class="own">Needs a neighbour</span>`}</div>`;}).join('')}</div>
  <h3 class="s">Fleet and upgrades</h3>
  <div class="shop">${SHOP.map(it=>{const can=it.can(),cost=it.cost();return`<div class="item"><h4><span class="c${it.icon==='heli'||it.icon==='bolt'?'P':it.icon}">${svg(it.icon)}</span>${it.name}</h4><p>${it.desc}</p><div class="ft"><span class="own">${it.own()}</span>${can?`<button class="sbtn go" type="button" data-buy="${it.id}" ${meta.money<cost?'disabled':''}>$${cost.toLocaleString()}</button>`:'<span class="own">Maxed</span>'}</div></div>`;}).join('')}</div>`;
}
function showShop(){
  if(mode!=='play')return;
  S.paused=true;mode='shop';S.selU=null;
  ovRender=()=>{ov.innerHTML=`<div class="card"><span class="lbl">City shop · Day ${S.day}</span><h2>Grow Ashford's emergency services</h2><p class="tag" style="margin:0">Budget: <b class="money">$${meta.money.toLocaleString()}</b>. The game is paused while you shop.</p>${shopHTML()}<div class="row"><button class="btn primary lg" type="button" data-m="close">Back to work <span class="kbd">B</span></button></div></div>`;};
  ov.hidden=false;ovRender();renderUI(true);
}
function closeShop(){if(mode!=='shop')return;mode='play';S.paused=false;hideOv();renderUI(true);}
function showMenu(){
  mode='menu';ov.hidden=false;
  ovRender=()=>{ov.innerHTML=`<div class="card">
    <span class="badge911">911</span>
    <div class="big">DISPATCH<br><em>RUSH</em></div>
    <p class="tag">You run every police car, fire truck and ambulance in Ashford. 911 calls pop up on the map. Get the right vehicles there before time runs out, earn money and unlock the rest of the city.</p>
    <ol class="how">
      <li><b>Watch the map.</b> New 911 calls appear on their own, with a timer ring around them.</li>
      <li><b>Click a vehicle, then the emergency.</b> It drives the real streets to get there. Some scenes need more help than reported.</li>
      <li><b>Grow the city.</b> Spend your budget on vehicles, upgrades and new districts with their own stations.</li>
    </ol>
    <div class="row">
      ${hasSave?`<button class="btn primary lg" type="button" data-m="cont">Continue: day ${meta.day}</button><button class="btn lg" type="button" data-m="new">New career</button>`:`<button class="btn primary lg" type="button" data-m="new">Start your first shift</button>`}
    </div>
    <div class="keys">Keys: <span class="kbd">R</span> send nearest units · <span class="kbd">Esc</span> cancel · <span class="kbd">G</span> green wave · <span class="kbd">B</span> city shop · <span class="kbd">P</span> pause · <span class="kbd">F</span> speed. Drag to move the map, scroll or pinch to zoom.</div>
  </div>`;};
  ovRender();
}
function startShift(){
  audioOn();hideOv();newShift();mode='play';lastSig={};
  fitOwned();renderUI(true);
  toast(`Day ${S.day}: ${S.mod.name}`,S.mod.desc,S.mod.id==='none'?'info':'warn',5000);
}
function grade(st){
  const tot=st.resolved+st.failed;if(!tot)return'–';const r=st.resolved/tot;
  return r>=.95&&st.resolved>=10?'S':r>=.85?'A':r>=.7?'B':r>=.5?'C':'D';
}
function endShift(){
  mode='summary';const st=S.stats;S.selU=null;
  meta.day++;saveMeta();hasSave=true;renderSel();
  ov.hidden=false;
  ovRender=()=>{const g=grade(st),dRep=Math.round(meta.rep-st.rep0);ov.innerHTML=`<div class="card">
    <div class="grade">${g}</div>
    <span class="lbl">Shift report · Day ${meta.day-1}</span>
    <h2>${g==='S'?'Flawless shift. The city owes you a coffee.':g==='A'?'Great shift. Ashford sleeps soundly.':g==='B'?'Solid work out there.':g==='C'?'Rough day on the radio.':'Ashford had a very bad day.'}</h2>
    <p class="tag" style="margin:0">Rank: <b style="color:var(--text)">${rankOf(meta.resolved)}</b> · ${meta.resolved} emergencies handled in your career · ${meta.districts.length}/9 districts.</p>
    <div class="stats">
      <div class="st"><div class="k">911 calls</div><div class="v">${st.calls}</div></div>
      <div class="st"><div class="k">Resolved</div><div class="v" style="color:var(--ok)">${st.resolved}</div></div>
      <div class="st"><div class="k">Failed</div><div class="v" style="color:var(--bad)">${st.failed}</div></div>
      <div class="st"><div class="k">Best streak</div><div class="v">${st.best}</div></div>
      <div class="st"><div class="k">Earned</div><div class="v money">$${st.earned.toLocaleString()}</div></div>
      <div class="st"><div class="k">Reputation</div><div class="v">${Math.round(meta.rep)} <small style="font-size:13px;color:${dRep>=0?'var(--ok)':'var(--bad)'}">${dRep>=0?'+':''}${dRep}</small></div></div>
    </div>
    <p class="tag" style="margin:0">Budget: <b class="money">$${meta.money.toLocaleString()}</b></p>
    ${shopHTML()}
    <div class="row"><button class="btn primary lg" type="button" data-m="next">Start day ${meta.day}</button><button class="btn lg" type="button" data-m="menu">Main menu</button></div>
  </div>`;};
  ovRender();
}
function gameOver(){
  mode='over';const st=S.stats;ov.hidden=false;S.selU=null;renderSel();
  ovRender=()=>{ov.innerHTML=`<div class="card"><span class="lbl">Day ${S.day}</span><div class="big">YOU'RE<br><em>FIRED</em></div>
    <p class="tag">Ashford lost faith in its emergency services. The mayor wants to know why the llama is still loose.</p>
    <div class="stats">
      <div class="st"><div class="k">Days survived</div><div class="v">${S.day-1}</div></div>
      <div class="st"><div class="k">Career handled</div><div class="v">${meta.resolved}</div></div>
      <div class="st"><div class="k">Districts</div><div class="v">${meta.districts.length}/9</div></div>
      <div class="st"><div class="k">This shift</div><div class="v">${st.resolved} ok · ${st.failed} failed</div></div>
    </div>
    <div class="row"><button class="btn primary lg" type="button" data-m="new">Start a new career</button></div></div>`;};
  ovRender();
  try{localStorage.removeItem(STORE);}catch(e){}hasSave=false;
}
function showPause(){
  ov.hidden=false;
  ovRender=()=>{ov.innerHTML=`<div class="card" style="width:min(420px,100%)"><span class="lbl">Paused · ${clockStr()}</span><h2 style="margin:6px 0 16px">Coffee break</h2><div class="row"><button class="btn primary lg" type="button" data-m="resume">Back to work</button><button class="btn lg" type="button" data-m="quit">Quit to menu</button></div></div>`;};
  ovRender();
}
function togglePause(){
  if(mode!=='play')return;
  S.paused=!S.paused;renderUI(true);
  if(S.paused)showPause();else hideOv();
}
function confirmDistrict(d){
  if(mode!=='play')return;
  const D=DISTRICTS[d],can=canBuyD(d),pd=priceD(),afford=meta.money>=pd;
  S.paused=true;mode='shop';ov.hidden=false;
  ovRender=()=>{ov.innerHTML=`<div class="card" style="width:min(460px,100%)"><span class="lbl">District</span><h2 style="margin:4px 0 6px">${D.name}</h2>
    <p class="tag" style="margin-bottom:14px">${D.blurb} ${can?`Unlocking adds a ${D.st==='P'?'police precinct and a patrol car':D.st==='F'?'fire station and a fire engine':'hospital and an ambulance'}, plus more 911 calls to earn from.`:'You need to own a district next to it first.'}</p>
    <div class="row">${can?`<button class="btn primary lg" type="button" data-buyd="${d}" ${afford?'':'disabled'}>${afford?`Unlock for $${pd.toLocaleString()}`:`Need $${pd.toLocaleString()}`}</button>`:''}<button class="btn lg" type="button" data-m="close">Not now</button></div>
    <p class="tag" style="margin:12px 0 0;font-size:13px">Budget: <b class="money">$${meta.money.toLocaleString()}</b></p></div>`;};
  ovRender();
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;audioOn();
  if(b.dataset.buyd!==undefined){const d=+b.dataset.buyd;if(buyDistrict(d)){if(ov.querySelector('.dgrid'))ovRender();else closeShop();renderTop();}return;}
  if(b.dataset.buy){const it=SHOP.find(s=>s.id===b.dataset.buy);if(it&&it.can()&&meta.money>=it.cost()){meta.money-=it.cost();it.buy();saveMeta();sfx.buy();if(ovRender)ovRender();renderTop();}return;}
  const m=b.dataset.m;
  if(m==='new'){meta=freshMeta();saveMeta();hasSave=true;startShift();}
  else if(m==='cont'||m==='next')startShift();
  else if(m==='menu'||m==='quit'){saveMeta();S=null;$('#incPanel').hidden=true;lastSig={};showMenu();renderTop();renderSel();fitOwned();}
  else if(m==='resume')togglePause();
  else if(m==='close')closeShop();
});

/* ---------------------------------------------------------------------
   INPUT
   --------------------------------------------------------------------- */
$('#bPause').onclick=()=>togglePause();
$('#bWave').onclick=()=>greenWave();
$('#bShop').onclick=()=>{audioOn();if(mode==='shop')closeShop();else showShop();};
$('#bMute').onclick=()=>{muted=!muted;$('#bMute').textContent=muted?'Sound off':'Sound on';audioOn();};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#mtL').onclick=()=>{document.body.classList.toggle('show-left');document.body.classList.remove('show-right');};
$('#mtR').onclick=()=>{document.body.classList.toggle('show-right');document.body.classList.remove('show-left');};
addEventListener('keydown',e=>{
  const k=e.key;
  if(mode==='shop'){if(k==='b'||k==='B'||k==='Escape')closeShop();return;}
  if(mode!=='play')return;
  audioOn();
  if(S.paused){if(k==='p'||k==='P'||k==='Escape')togglePause();return;}
  if(k==='r'||k==='R')sendRecommended();
  else if(k==='Escape'){if(S.selU)selectUnit(null);else select(null);}
  else if(k==='p'||k==='P')togglePause();
  else if(k==='g'||k==='G')greenWave();
  else if(k==='b'||k==='B')showShop();
  else if(k==='f'||k==='F')setSpeed(S.speed%3+1);
});
function hitTest(sx,sy){
  if(S){
    const tw=tileW(),th=tileH();
    const us=[...S.units].sort((a,b)=>(b.id===S.selU)-(a.id===S.selU));
    for(const u of us){const a=unitAnchor(u);if(sx>=a.x-tw/2-3&&sx<=a.x+tw/2+3&&sy>=a.y-th-10&&sy<=a.y+2)return{kind:'unit',u};}
    let best=null,bd=1e9;
    for(const inc of S.incidents){if(!live(inc))continue;const d=Math.hypot(X(inc.x)-sx,Y(inc.y)-sy);if(d<28&&d<bd){bd=d;best=inc;}}
    if(best)return{kind:'inc',inc:best};
  }
  const w=toWorld(sx,sy);
  if(w.x>=0&&w.x<W&&w.y>=0&&w.y<H){const d=distOf(w.x,w.y);if(!owned(d))return{kind:'lock',d};}
  return null;
}
function mapClick(sx,sy){
  if(!S||mode!=='play')return;
  const h=hitTest(sx,sy);
  if(!h){if(S.selU)selectUnit(null);else select(null);return;}
  if(h.kind==='unit'){
    const u=h.u,inc=S.sel&&incById(S.sel);
    if(inc&&!S.selU&&canSend(u,inc)){dispatch(u,inc);renderUI(true);return;}
    selectUnit(S.selU===u.id?null:u);return;
  }
  if(h.kind==='inc'){
    const u=S.selU&&unitById(S.selU);
    if(u){if(canSend(u,h.inc)){dispatch(u,h.inc);S.selU=null;select(h.inc.id);}else toast(whyNot(u,h.inc),'','warn',2200);return;}
    select(h.inc.id);return;
  }
  if(h.kind==='lock')confirmDistrict(h.d);
}
const ptrs=new Map();let drag=null,pinch=null;
function zoomAt(sx,sy,f){const w=toWorld(sx,sy);cam.z=clamp(cam.z*f,.12,2.6);cam.x=w.x-sx/cam.z;cam.y=w.y-sy/cam.z;camTween=null;}
cv.addEventListener('pointerdown',e=>{
  audioOn();cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};drag=null;}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){
    if(S&&mode==='play'){const h=hitTest(e.clientX,e.clientY);S.hover=h;cv.classList.toggle('hand',!!h);}
    else cv.classList.remove('hand');
    return;
  }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((a.x+b.x)/2,(a.y+b.y)/2,(pinch.z*d/pinch.d)/cam.z);return;}
  if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>6){drag.moved=true;cv.classList.add('drag');}
    if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;camTween=null;}}
});
function endPtr(e){
  const was=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(was&&drag&&!drag.moved&&e.type==='pointerup')mapClick(e.clientX,e.clientY);
  if(!ptrs.size){drag=null;cv.classList.remove('drag');}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{if(S)S.hover=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015));},{passive:false});

/* ---------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='play'&&S&&!S.paused)update(dt);
  draw(now/1000);
  requestAnimationFrame(frame);
}
function buildOverview(){
  const s=.25,c=document.createElement('canvas');c.width=Math.ceil(W*s);c.height=Math.ceil(H*s);
  const g=c.getContext('2d');g.scale(s,s);drawStatic(g,0,0,W,H);return c;
}
function boot(data){
  const m=loadMeta();
  if(data&&data.meta&&data.meta.districts){meta=data.meta;hasSave=true;}
  else if(m){meta=m;hasSave=true;}
  else{meta=freshMeta();hasSave=false;}
  resize();fitOwned();renderTop();showMenu();
  let done=false;const ready=()=>{if(done)return;done=true;fontsReady=true;tiles.clear();tileBytes=0;overview=buildOverview();};
  (document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(ready);
  setTimeout(ready,2200);
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
window.claude?.hot?.snapshot?.(()=>({meta}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
