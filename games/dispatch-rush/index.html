<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed night city map on a canvas; dispatcher console panels float over it.
   Incidents + radio on the left, fleet on the right, phone lines and the live call at the bottom. */
:root{
  --bg:#05080e;
  --panel:rgba(9,14,23,.92);
  --panel-2:#0f1826;
  --line:#1d2b40;
  --line-2:#2b3e5a;
  --text:#e4ecf6;
  --muted:#8597b0;
  --dim:#56677f;
  --amber:#ffb020;
  --amber-ink:#1c1303;
  --police:#4a90ff;
  --fire:#ff5a3c;
  --med:#2fd39a;
  --ok:#53e08a;
  --warn:#ffb020;
  --bad:#ff4d5e;
  --f-display:'Chakra Petch','Barlow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --top:72px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ico{width:14px;height:14px;display:inline-block;vertical-align:-2px;fill:currentColor;flex:none}
.cP{color:var(--police)}.cF{color:var(--fire)}.cM{color:var(--med)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- top bar */
#top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px;z-index:5}
.brand{display:flex;align-items:center;gap:9px;padding-right:6px}
.badge911{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--amber);color:var(--amber-ink);border-radius:6px;padding:3px 7px;letter-spacing:.04em}
.brand b{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.08em}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:-2px}
.seg{display:flex;flex-direction:column;gap:1px;padding:0 10px;border-left:1px solid var(--line)}
.seg .v{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.shift{width:90px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.shift i{display:block;height:100%;background:var(--amber);width:0}
.rep{width:96px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.rep i{display:block;height:100%;width:60%;background:var(--ok);transition:width .3s,background .3s}
#tStreak{color:var(--amber)}
.ctrls{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.05em;color:var(--text);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tb:hover{border-color:var(--muted)}
.tb.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.tb.wave{border-color:#2b6a4a;color:var(--ok)}
.tb.wave.on{background:var(--ok);color:#03150a;border-color:var(--ok)}
.tb:disabled{opacity:.45;cursor:default}
.tb.mtab{display:none}

/* ---------- side panels */
#left,#right{position:absolute;top:var(--top);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;z-index:3;min-height:0}
#left{left:max(12px,env(safe-area-inset-left,0px));width:290px}
#right{right:max(12px,env(safe-area-inset-right,0px));width:250px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:11px 12px 8px}
.ph .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scroll{overflow-y:auto;min-height:0;padding:0 8px 8px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#incList{flex:1;display:flex;flex-direction:column;gap:6px}
.empty{color:var(--dim);font-size:13px;padding:10px 6px;line-height:1.45}
.inc{display:grid;grid-template-columns:30px 1fr;gap:4px 9px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:8px 9px 9px;cursor:pointer;width:100%}
.inc:hover{border-color:var(--line-2);border-left-color:var(--c)}
.inc.sel{border-color:var(--amber);border-left-color:var(--c);background:#152033}
.inc.done{opacity:.55}
.inc .ic{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.inc .ic .ico{width:16px;height:16px}
.inc .t{font-weight:600;font-size:14px;line-height:1.2;display:flex;justify-content:space-between;gap:6px;min-width:0}
.inc .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inc .bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.inc .bar i{display:block;height:100%}
.needs{display:flex;gap:5px;flex-wrap:wrap;grid-column:2}
.nd{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px;padding:1px 6px 1px 4px;border-radius:999px;background:#0a111c;border:1px solid var(--line)}
.nd.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.nd.unk{color:var(--warn)}
.stt{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:4px;white-space:nowrap;align-self:flex-start}
.stt.open{color:var(--warn);background:rgba(255,176,32,.1)}
.stt.working{color:var(--ok);background:rgba(83,224,138,.1)}
.stt.chase{color:var(--bad);background:rgba(255,77,94,.12)}
.stt.done{color:var(--ok)}.stt.failed{color:var(--bad)}
#radio{height:170px;flex:none;border-top:1px solid var(--line);font-size:12px;line-height:1.4;display:flex;flex-direction:column;gap:5px;padding-top:8px}
#radio .r{color:var(--muted)}
#radio .r b{color:var(--text);font-weight:600}
#radio .r .tm{font-family:var(--f-mono);color:var(--dim);font-size:11px;margin-right:5px}
#unitList{display:flex;flex-direction:column;gap:3px}
.ug{margin:8px 4px 3px;display:flex;align-items:center;gap:6px}
.ur{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;background:transparent;border:1px solid transparent;width:100%;text-align:left}
.ur:hover{background:var(--panel-2);border-color:var(--line)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.dot.P{background:var(--police)}.dot.F{background:var(--fire)}.dot.M{background:var(--med)}
.ur .nm{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.us{font-family:var(--f-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.us.idle{color:var(--ok);background:rgba(83,224,138,.09)}
.us.enroute{color:var(--amber);background:rgba(255,176,32,.1)}
.us.onscene{color:#ff8a9a;background:rgba(255,77,94,.1)}
.us.returning{color:var(--muted);background:rgba(133,151,176,.1)}

/* ---------- incident detail */
#incPanel{position:absolute;top:var(--top);right:calc(max(12px,env(safe-area-inset-right,0px)) + 262px);width:340px;max-height:calc(100% - var(--top) - 120px);display:flex;flex-direction:column;z-index:4}
#incPanel .scroll{padding:0 12px 12px}
.ip-h{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 6px}
.ip-h .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.ip-h .ic .ico{width:19px;height:19px}
.ip-h h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.15;text-wrap:balance}
.ip-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.x{margin-left:auto;background:none;border:1px solid var(--line-2);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--muted);flex:none}
.x:hover{color:var(--text)}
.ip-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.ip-bar i{display:block;height:100%}
.ip-st{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ip-needs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.need{flex:1;min-width:84px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:2px}
.need .k{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
.need .v{font-family:var(--f-mono);font-size:16px;font-weight:600}
.need.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.need.unk .v{color:var(--warn);font-size:13px}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:rgba(255,77,94,.4);background:transparent}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.full{width:100%}
.kbd{font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;opacity:.7}
.sec{margin:12px 0 5px}
.urow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .nm{flex:1;min-width:0;font-weight:500}
.urow .eta{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.sbtn{border:1px solid var(--line-2);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:12px}
.sbtn.go{border-color:var(--amber);color:var(--amber)}
.sbtn.go:hover{background:var(--amber);color:var(--amber-ink)}

/* ---------- phone dock + call */
#dock{position:absolute;left:calc(max(12px,env(safe-area-inset-left,0px)) + 302px);right:calc(max(12px,env(safe-area-inset-right,0px)) + 262px);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:4}
#dock>*{pointer-events:auto}
#lines{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.line{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--amber);cursor:pointer;box-shadow:0 0 0 0 rgba(255,176,32,.55);animation:ring 1.2s infinite}
.line .ico{width:16px;height:16px;color:var(--amber);animation:wob .4s infinite alternate}
.line b{font-family:var(--f-display);font-size:13px;letter-spacing:.06em}
.line .rt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.line .rt.low{color:var(--bad)}
.line .ans{background:var(--amber);color:var(--amber-ink);font-weight:700;border-radius:6px;padding:4px 9px;font-size:12px}
.line.hold{animation:none;border-color:var(--line-2);cursor:default}
.line.hold .ans{background:var(--line-2);color:var(--muted)}
.line.hold .ico{animation:none;color:var(--muted)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,176,32,.5)}100%{box-shadow:0 0 0 12px rgba(255,176,32,0)}}
@keyframes wob{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#call{width:min(660px,100%);display:flex;flex-direction:column;max-height:calc(100vh - var(--top) - 80px)}
.ch{display:flex;gap:12px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:#081019;flex:none;position:relative}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--panel-2)}
.who{min-width:0}
.who .nm{font-weight:600;font-size:15px}
.who .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.mood{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:rgba(255,176,32,.1);color:var(--amber)}
.case{margin-left:auto;display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.case .k{color:var(--dim);font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:10px;align-self:center}
.case .v{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.case .v.q{color:var(--dim);font-weight:400}
.log{padding:10px 12px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:90px;max-height:190px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.msg{max-width:84%;padding:7px 10px;border-radius:10px;font-size:14px;line-height:1.35;animation:pop .18s ease-out}
.msg.c{align-self:flex-start;background:#17243a;border-bottom-left-radius:3px}
.msg.o{align-self:flex-end;background:rgba(255,176,32,.13);color:#ffe2a6;border-bottom-right-radius:3px}
.msg.typing{color:var(--muted);letter-spacing:.2em}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px;padding:0 12px 10px}
.opt{text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.3}
.opt:hover{border-color:var(--amber)}
.opt:disabled{opacity:.4;cursor:default}
.opt .kbd{flex:none;margin-top:1px}
.opt.adv{border-style:dashed;border-color:#2b6a4a}
.cf{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.cf .btn{flex:1}
#cpr{margin:0 12px 10px;padding:10px;border:1px dashed #2b6a4a;border-radius:8px;display:flex;flex-direction:column;gap:8px}
.cprbar{position:relative;height:22px;border-radius:6px;background:#0a111c;border:1px solid var(--line-2);overflow:hidden}
.cprbar .zone{position:absolute;left:38%;width:24%;top:0;bottom:0;background:rgba(83,224,138,.22);border-left:1px solid var(--ok);border-right:1px solid var(--ok)}
.cprbar .mk{position:absolute;top:2px;bottom:2px;width:6px;margin-left:-3px;border-radius:3px;background:var(--text);left:0}
.cprrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.pips i.h{background:var(--ok)}.pips i.m{background:var(--bad)}

/* ---------- toasts */
#toasts{position:absolute;top:var(--top);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--k);border-radius:8px;padding:8px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .2s ease-out;width:100%}
.toast b{display:block;font-size:14px}
.toast span{color:var(--muted)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}

/* ---------- overlay screens */
#ov{position:absolute;inset:0;z-index:10;background:rgba(3,6,11,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto;display:flex;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{margin:auto;width:min(760px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,8vw,72px);line-height:.92;letter-spacing:.02em;margin:10px 0 6px}
.big em{font-style:normal;color:var(--amber)}
.tag{color:var(--muted);font-size:15px;margin:0 0 20px;max-width:58ch;line-height:1.5}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 22px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.45;color:var(--muted);counter-increment:s}
.how li::before{content:"Step " counter(s);display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.how li b{color:var(--text)}
.keys{font-size:12px;color:var(--dim);margin-top:16px;line-height:1.7}
.keys .kbd{opacity:1;color:var(--muted);margin:0 2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn.lg{padding:12px 20px;font-size:15px;font-family:var(--f-display);letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0}
.st{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st .k{font-size:11px;color:var(--muted);font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.st .v{font-family:var(--f-mono);font-size:22px;font-weight:600;margin-top:2px}
.grade{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;color:var(--amber);float:right;margin-left:12px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0 20px}
.item{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.item h4{margin:0;font-size:15px;display:flex;gap:7px;align-items:center}
.item p{margin:0;font-size:13px;color:var(--muted);line-height:1.4;flex:1}
.item .ft{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .own{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.mod{display:inline-flex;gap:8px;align-items:center;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.3);color:var(--amber);border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:14px}
h2{font-family:var(--f-display);font-size:28px;margin:0 0 4px;text-wrap:balance}
h3.s{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}

/* ---------- narrow screens */
@media (max-width:900px){
  #top{gap:6px;padding:6px 8px}
  .brand small,.seg.hide-n{display:none}
  .seg{padding:0 7px}
  .seg .v{font-size:13px}
  .rep,.shift{width:64px}
  .tb{padding:5px 8px}
  .tb.mtab{display:inline-flex}

'use strict';
/* =====================================================================
   DISPATCH RUSH — an emergency dispatcher game for the browser
   ===================================================================== */
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const ICON={
  P:'M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z',
  F:'M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z',
  M:'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',
  phone:'M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z',
  heli:'M3 5h18v2h-8v2.2a5 5 0 0 1 4 4.8v1h3v2h-3.4a5 5 0 0 1-9.2 0H4v-2h3v-1a5 5 0 0 1 4-4.8V7H3z'
};
const svg=(k,cls='')=>`<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[k]}"/></svg>`;
const PATHS={};for(const k in ICON)PATHS[k]=new Path2D(ICON[k]);
const TCOL={P:'#4a90ff',F:'#ff5a3c',M:'#2fd39a'};
const TNAME={P:'Police',F:'Fire',M:'Medical'};
const TVAR={P:'var(--police)',F:'var(--fire)',M:'var(--med)'};

/* ---------------------------------------------------------------------
   CITY: a seeded street grid with a river, three bridges and districts
   --------------------------------------------------------------------- */
const W=1700,H=1100,COLS=14,ROWS=9,RIVER_ROW=4;
const R=mulberry32(911);
const colX=[],rowY=[];
(function(){
  const m=70,sx=(W-2*m)/(COLS-1);
  for(let c=0;c<COLS;c++)colX.push(m+c*sx+(c>0&&c<COLS-1?(R()-.5)*26:0));
  const sy=(H-2*m)/((ROWS-2)+1.7);let y=m;
  for(let r=0;r<ROWS;r++){rowY.push(y+((r>0&&r<ROWS-1)?(R()-.5)*14:0));y+=(r===RIVER_ROW?1.7:1)*sy;}
})();
const riverMid=(rowY[RIVER_ROW]+rowY[RIVER_ROW+1])/2;
const riverY=x=>riverMid+Math.sin(x/150)*14+Math.sin(x/61+1)*6;
const ROW_NAMES=['North Ring','Elm St','Oak St','Pine St','Riverside Dr','Canal St','Cedar St','Birch St','South Ring'];
const COL_NAMES=['Quay St','Bay Ave','1st Ave','2nd Ave','3rd Ave','Main St','Center Ave','4th Ave','5th Ave','Union St','Foundry Rd','Kiln St','Rail Ave','East End Rd'];
const FAKE=['Bubblegum Ave','Nowhere Ln','Unicorn Blvd','Fake St','Wonky Way','Bigfoot Dr','Lava Ln','Mystery Ct','Yolo Pkwy','Banana Blvd','Pickle Row','Narnia Rd'];
const nid=(r,c)=>r*COLS+c;
const nodes=[];let edges=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)nodes.push({id:nid(r,c),r,c,x:colX[c],y:rowY[r],adj:[]});
(function(){
  const all=[];
  const add=(a,b,h)=>{const A=nodes[a],B=nodes[b];all.push({a,b,h,r:A.r,c:A.c,len:Math.hypot(B.x-A.x,B.y-A.y),bridge:false});};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-1;c++)add(nid(r,c),nid(r,c+1),true);
  for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS;c++)add(nid(r,c),nid(r+1,c),false);
  const BR=[2,6,11];
  const alive=all.map(e=>!(!e.h&&e.r===RIVER_ROW&&!BR.includes(e.c)));
  all.forEach(e=>{if(!e.h&&e.r===RIVER_ROW&&BR.includes(e.c))e.bridge=true;});
  const deg=new Array(nodes.length).fill(0);
  all.forEach((e,i)=>{if(alive[i]){deg[e.a]++;deg[e.b]++;}});
  const connected=()=>{const seen=new Uint8Array(nodes.length);const st=[0];seen[0]=1;let n=1;const adj=nodes.map(()=>[]);all.forEach((e,i)=>{if(alive[i]){adj[e.a].push(e.b);adj[e.b].push(e.a);}});while(st.length){const u=st.pop();for(const v of adj[u])if(!seen[v]){seen[v]=1;n++;st.push(v);}}return n===nodes.length;};
  const order=all.map((_,i)=>i).sort(()=>R()-.5);
  for(const i of order){
    const e=all[i];
    if(!alive[i]||e.bridge)continue;
    if((e.h&&(e.r===0||e.r===ROWS-1))||(!e.h&&(e.c===0||e.c===COLS-1)))continue;
    if(R()>0.15)continue;
    if(deg[e.a]<=2||deg[e.b]<=2)continue;
    alive[i]=false;
    if(!connected())alive[i]=true;else{deg[e.a]--;deg[e.b]--;}
  }
  edges=all.filter((_,i)=>alive[i]);
  edges.forEach((e,i)=>{e.id=i;e.major=(e.h&&(e.r===0||e.r===ROWS-1||e.r===2||e.r===6))||(!e.h&&(e.c===0||e.c===COLS-1||e.c===5));nodes[e.a].adj.push(e);nodes[e.b].adj.push(e);});
})();
const other=(e,n)=>e.a===n?e.b:e.a;
const lp=(e,t)=>{const A=nodes[e.a],B=nodes[e.b];return{x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t};};
const locPt=l=>l.e?lp(l.e,l.t):{x:nodes[l.node].x,y:nodes[l.node].y};
const STN={P:{node:nid(2,6),name:'Police HQ'},F:{node:nid(6,4),name:'Fire Station 7'},M:{node:nid(3,10),name:'St. Mercy Hospital'}};
function addrOf(l){
  const e=l.e;
  if(e.h){const n=e.c*100+2*Math.round(l.t*48)+1;return{addr:`${n} ${ROW_NAMES[e.r]}`,cross:COL_NAMES[l.t<.5?e.c:e.c+1]};}
  const n=e.r*100+2*Math.round(l.t*48)+2;return{addr:`${n} ${COL_NAMES[e.c]}`,cross:ROW_NAMES[l.t<.5?e.r:e.r+1]};
}

/* shortest paths: graph is static, so cache one Dijkstra per source */
const DIJ=new Map();
function dij(src){
  if(DIJ.has(src))return DIJ.get(src);
  const N=nodes.length,d=new Float64Array(N).fill(Infinity),prev=new Int32Array(N).fill(-1),done=new Uint8Array(N);d[src]=0;
  for(;;){let u=-1,b=Infinity;for(let i=0;i<N;i++)if(!done[i]&&d[i]<b){b=d[i];u=i;}if(u<0)break;done[u]=1;
    for(const e of nodes[u].adj){const v=other(e,u),nd=d[u]+e.len;if(nd<d[v]){d[v]=nd;prev[v]=u;}}}
  const r={d,prev};DIJ.set(src,r);return r;
}
function planRoute(from,to){
  const S0=from.e?[{n:from.e.a,c:from.t*from.e.len},{n:from.e.b,c:(1-from.t)*from.e.len}]:[{n:from.node,c:0}];
  const E0=to.e?[{n:to.e.a,c:to.t*to.e.len},{n:to.e.b,c:(1-to.t)*to.e.len}]:[{n:to.node,c:0}];
  const tp=locPt(to);let best={cost:Infinity,pts:[]};
  if(from.e&&to.e&&from.e===to.e)best={cost:Math.abs(from.t-to.t)*to.e.len,pts:[{x:tp.x,y:tp.y,loc:to}]};
  for(const s of S0){const D=dij(s.n);for(const en of E0){const c=s.c+D.d[en.n]+en.c;if(c<best.cost){
    const np=[];for(let v=en.n;v!==-1;v=D.prev[v])np.push(v);np.reverse();
    const pts=np.map(v=>({x:nodes[v].x,y:nodes[v].y,loc:{node:v}}));
    if(to.e)pts.push({x:tp.x,y:tp.y,loc:to});best={cost:c,pts};}}}
  return best;
}

let AC=null,muted=false;
function audioOn(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,type='sine',v=.05,when=0,to){if(!AC||muted)return;try{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.linearRampToValueAtTime(to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sfx={
 ring(soft){const v=soft?.018:.05;for(const o of [0,.42]){tone(440,.36,'sine',v,o);tone(480,.36,'sine',v,o);}},
 pick(){tone(880,.07,'square',.025);tone(1320,.08,'square',.02,.07);},
 tick(){tone(1250,.035,'square',.015);},
 siren(t){if(t==='F')tone(480,.55,'sawtooth',.02,0,760);else if(t==='M'){tone(960,.14,'square',.02);tone(760,.14,'square',.02,.15);}else tone(700,.32,'sawtooth',.02,0,1300);},
 good(){[660,880,1175].forEach((f,i)=>tone(f,.2,'triangle',.05,i*.08));},
 bad(){tone(190,.35,'sawtooth',.045);tone(140,.4,'sawtooth',.035,.12);},
 beat(ok){tone(ok?520:200,.09,ok?'triangle':'square',.05);},
 alert(){tone(990,.1,'square',.025);tone(990,.1,'square',.025,.16);},
};

}

const clockMin=()=>8*60+S.t/S.len*720;

const mult=()=>1+Math.min(4,Math.floor(S.streak/2))*.5;

const incById=id=>S.incidents.find(i=>i.id===id);
const live=i=>i.status==='open'||i.status==='working';
function unitSpeed(u){
  let s=u.heli?165:BASE_SPEED[u.type];
  s*=1+.12*meta.up.engine;

function modWeight(t){
  const m=S.mod.id,g=t.tags;
  if(m==='heat'&&g.includes('fire'))return 2;
  if(m==='moon'&&g.includes('funny'))return 2.5;
  if(m==='rain'&&g.includes('crash'))return 2.4;
  if(m==='fest'&&g.includes('police'))return 1.7;
  return 1;
}
function wpick(list,wf){const ws=list.map(wf),sum=ws.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i];}return list[list.length-1];}
function randomLoc(){
  for(let k=0;k<60;k++){
    const e=pick(edges);if(e.bridge)continue;
    const t=rand(.25,.75),p=lp(e,t);
    if(S.incidents.some(i=>live(i)&&Math.hypot(i.x-p.x,i.y-p.y)<90))continue;
    if([...S.calls,S.active].some(c=>c&&Math.hypot(locPt(c.loc).x-p.x,locPt(c.loc).y-p.y)<90))continue;
    if(Object.values(STN).some(s=>Math.hypot(nodes[s.node].x-p.x,nodes[s.node].y-p.y)<60))continue;
    return{e,t};
  }
  return{e:pick(edges),t:.5};
}
function freeLine(){const used=new Set([...S.calls.map(c=>c.line),S.active&&S.active.line]);for(let i=1;i<=9;i++)if(!used.has(i))return i;return 9;}
function spawnCall(){
  const prankP=Math.min(.3,.12+.02*(S.day-1)+(S.mod.id==='moon'?.08:0));
  const prank=Math.random()<prankP;
  const tpl=prank?pick(PRANKS):wpick(T.filter(t=>(t.minDay||1)<=S.day),t=>t.w*modWeight(t));
  const loc=randomLoc(),a=addrOf(loc);
  const addr=prank?`${100+2*Math.floor(Math.random()*440)} ${pick(FAKE)}`:a.addr;
  const name=`${pick(FIRSTS)} ${pick(LASTS)}`;
  const mood=prank?(Math.random()<.5?'Giggling':pick(['Calm','Excited','Panicked'])):(tpl.mood||pick(MOODS));
  const ring=22+(meta.up.headset?8:0);
  S.calls.push({id:Math.random().toString(36).slice(2),line:freeLine(),tpl,prank,loc,addr,cross:a.cross,
    caller:{name,mood,ini:name.split(' ').map(s=>s[0]).join(''),col:pick(AVCOL)},ring,ringMax:ring,log:[],asked:{},heard:{},
    roll:prank?[]:tpl.extras.map(x=>Math.random()<x.p),pending:null,bonusPat:0,rewardMult:1,cpr:null,talk:0});
  sfx.ring();S.ringT=2.4;
  hint('ring','A line is ringing','Press Space or click Answer before the caller gives up.');
}
function missCall(c){
  S.calls=S.calls.filter(x=>x!==c);S.stats.missed++;S.streak=0;rep(-4);
  toast(`Missed call on line ${c.line}`,'The caller hung up. Reputation -4','bad');sfx.bad();
}
const ansDelay=s=>(meta.up.espresso?.45:.95)+Math.min(1.1,s.length*.009);
function answer(c){
  if(!c||S.active)return;
  S.calls=S.calls.filter(x=>x!==c);S.active=c;S.stats.answered++;
  c.log.push({o:1,text:"911, what's your emergency?"});
  c.pending={t:.7,fn:()=>{c.log.push({o:0,text:pick(c.tpl.open)});}};
  sfx.pick();renderCall();
  hint('answer','Interview the caller','Get the address and what happened. Pranksters give streets that aren\'t on the map.');
}
function callOptions(c){
  if(c.cpr&&c.cpr.on)return[];
  const t=c.tpl,o=[];
  if(!c.asked.what)o.push({id:'what',q:"Tell me what's happening."});
  if(!c.asked.addr)o.push({id:'addr',q:"What's the address of the emergency?"});
  t.extras.forEach((x,i)=>{if(!c.asked['x'+i])o.push({id:'x'+i,q:x.q});});
  if(t.advice&&!c.asked.adv&&c.heard.what)o.push({id:'adv',q:t.advice.q,adv:1});
  return o;
}
function ask(id){
  const c=S.active;if(!c||c.pending||c.asked[id])return;
  const t=c.tpl;let q,ans,after=()=>{};
  if(id==='what'){q="Tell me what's happening.";ans=t.what;}
  else if(id==='addr'){q="What's the address of the emergency?";ans=(c.prank?t.addrLine:pick(ADDR_LINES)).replace('{addr}',c.addr).replace('{cross}',c.cross);}
  else if(id[0]==='x'){const i=+id.slice(1),x=t.extras[i];if(!x)return;q=x.q;ans=c.prank?x.ans:(c.roll[i]?x.yes:x.no);}
  else if(id==='adv'){const a=t.advice;if(!a)return;q=a.q;
    if(a.cpr){c.asked.adv=1;c.log.push({o:1,text:q});c.log.push({o:0,text:"Okay, okay! My hands are on his chest!"});c.cpr={on:true,pos:0,dir:1,hits:0,tries:0,res:[]};sfx.tick();renderCall();return;}
    ans=a.a;after=()=>{c.bonusPat+=a.pat||0;};}
  else return;
  c.asked[id]=1;c.log.push({o:1,text:q});
  c.pending={t:ansDelay(ans),fn:()=>{c.log.push({o:0,text:ans});c.heard[id]=1;after();}};
  sfx.tick();renderCall();
}
function cprPress(){
  const c=S.active,k=c&&c.cpr;if(!k||!k.on)return;
  const hit=k.pos>.38&&k.pos<.62;k.tries++;k.res.push(hit);if(hit)k.hits++;sfx.beat(hit);
  if(k.tries>=6){k.on=false;const ok=k.hits>=4;
    c.pending={t:.7,fn:()=>{c.heard.adv=1;
      if(ok){c.log.push({o:0,text:"He coughed! He's breathing! Oh my god, he's breathing!"});c.bonusPat+=40;c.rewardMult=1.3;toast('CPR worked','Patient stabilised: more time and +30% reward','ok');sfx.good();}
      else{c.log.push({o:0,text:"I'm pushing, but I don't know if it's working..."});c.bonusPat+=8;}}};}
  renderCall();
}
function knownReq(c){
  const r={P:0,F:0,M:0};
  if(c.prank){Object.assign(r,c.tpl.fake);return r;}
  for(const k in c.tpl.req)r[k]+=c.tpl.req[k];
  c.tpl.extras.forEach((x,i)=>{if(c.heard['x'+i]&&c.roll[i])for(const k in x.add)r[k]+=x.add[k];});
  return r;
}
function sendHelp(){
  const c=S.active;if(!c||c.pending||!c.heard.addr||(c.cpr&&c.cpr.on))return;
  const inc=createIncident(c);closeCall();select(inc.id,true);sfx.alert();
  hint('incident','Send units','Pick units in the incident panel, or press R to send the recommended ones.');
}
function hangUp(){
  const c=S.active;if(!c||c.pending)return;
  if(c.prank){const amt=Math.round(150*mult());earn(amt);rep(2);S.stats.pranks++;toast('Prank call busted',`+$${amt}. Nice catch.`,'ok');sfx.good();radio('Dispatch',`Prank call on line ${c.line} terminated.`);}
  else{S.stats.hung++;S.streak=0;toast('That was a real emergency!',`${c.tpl.title} at ${c.addr} went unanswered. Reputation -12`,'bad');sfx.bad();closeCall();rep(-12);return;}
  closeCall();
}
function closeCall(){S.active=null;$('#call').hidden=true;}

function createIncident(c){
  const t=c.tpl,req={P:0,F:0,M:0};
  if(c.prank)Object.assign(req,t.fake);
  else{for(const k in t.req)req[k]+=t.req[k];t.extras.forEach((x,i)=>{if(c.roll[i])for(const k in x.add)req[k]+=x.add[k];});}
  const p=locPt(c.loc),pat=(t.pat||80)+c.bonusPat;
  const inc={id:++S.incSeq,tpl:t,title:t.title,icon:t.icon,loc:c.loc,x:p.x,y:p.y,addr:c.addr,caller:c.caller.name,req,
    known:c.heard.what?knownReq(c):null,pat,max:pat,prog:0,dur:t.dur||8,status:'open',assigned:new Set(),prank:c.prank,
    found:false,esc:false,rewardMult:c.rewardMult,chase:null,fade:0,born:performance.now()};
  if(t.chase&&!c.prank){inc.chase={kind:t.chase,x:p.x,y:p.y,loc:c.loc,path:[],prev:-1,ang:0,
    speed:t.chase==='car'?80:t.chase==='llama'?58:66,caught:false,gone:false,slow:false};S.suspects.push(inc.chase);}
  S.incidents.push(inc);
  radio('Dispatch',`${inc.title} reported at ${inc.addr}.`);
  return inc;
}
function startOf(u){
  if(u.path.length){const p=u.path[0];return{loc:p.loc,pre:Math.hypot(p.x-u.x,p.y-u.y),prefix:[p]};}

function arrive(u){

function prankFound(inc,u){

function release(inc){for(const id of inc.assigned){const u=unitById(id);if(u&&u.target===inc.id)sendHome(u);}inc.assigned.clear();}

function fail(inc,why){

function escalate(inc){

function moveAlong(o,d){

/* ---------------------------------------------------------------------
   MAIN UPDATE
   --------------------------------------------------------------------- */
function update(dt){
  const g=dt*S.speed;
  S.t+=g;
  if(S.wave.on>0)S.wave.on-=g;
  if(S.wave.cd>0)S.wave.cd-=g;
  S.nextCall-=g;
  if(S.nextCall<=0){
    const open=S.incidents.filter(live).length;
    if(S.calls.length<3&&open<5+S.day&&clockMin()<19*60+40)spawnCall();
    const lo=Math.max(7,18.5-S.day*1.5);
    S.nextCall=rand(lo,lo+8);
  }
  for(const c of [...S.calls]){c.ring-=g;if(c.ring<=0)missCall(c);}
  S.ringT-=dt;if(S.calls.length&&S.ringT<=0){sfx.ring(!!S.active);S.ringT=2.4;}
  const c=S.active;
  if(c){
    c.talk+=dt;
    if(c.pending){c.pending.t-=dt;if(c.pending.t<=0){const f=c.pending.fn;c.pending=null;f();renderCall();}}
    if(c.cpr&&c.cpr.on){const k=c.cpr;k.pos+=k.dir*dt*1.5;if(k.pos>1){k.pos=1;k.dir=-1;}if(k.pos<0){k.pos=0;k.dir=1;}const mk=$('#cprMk');if(mk)mk.style.left=(k.pos*100)+'%';}
  }
  for(const u of S.units){
    if(u.state==='enroute'){const inc=incById(u.target);if(inc&&inc.chase&&!inc.chase.caught){u.rr-=g;if(u.rr<=0){u.rr=.5;chaseRoute(u,inc.chase);}}}
    if(u.path.length){moveAlong(u,unitSpeed(u)*g);if(!u.path.length)arrive(u);}
  }
  for(const inc of S.incidents){
    if(!live(inc)){inc.fade-=dt;continue;}
    if(inc.chase){tickChase(inc,g);continue;}
    if(inc.prank){inc.pat-=g;if(inc.pat<=0){inc.status='failed';inc.fade=1;release(inc);}continue;}
    const on=counts(inc,['onscene']),r=inc.req;
    if(on.P>=r.P&&on.F>=r.F&&on.M>=r.M){
      inc.status='working';
      const extra=Math.max(0,on.total-(r.P+r.F+r.M));
      inc.prog+=g/inc.dur*(1+.25*extra);
      if(inc.prog>=1)resolve(inc);
    }else{
      inc.status='open';
      inc.pat-=g*(on.total>0?.5:1);
      if(inc.tpl.esc&&!inc.esc&&inc.pat<inc.max*.55&&on.F===0)escalate(inc);
      if(inc.pat<=0)fail(inc);
    }
    if(inc.icon==='F'&&inc.status==='open'&&Math.random()<dt*14)spawnSmoke(inc);
  }
  S.incidents=S.incidents.filter(i=>live(i)||i.fade>0);
  S.suspects=S.suspects.filter(s=>!s.gone);
  if(S.sel&&!incById(S.sel))S.sel=null;
  for(const f of S.floaters){f.life-=dt;f.y-=dt*22;}
  S.floaters=S.floaters.filter(f=>f.life>0);
  for(const p of S.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*p.gr;}
  S.parts=S.parts.filter(p=>p.life>0);
  S.uiT-=dt;if(S.uiT<=0){renderUI();S.uiT=.2;}
  if(mode==='play'&&S.t>=S.len)endShift();
}
function floater(x,y,text,col){S.floaters.push({x,y:y-20,text,col,life:1.8});}
function spawnSmoke(inc){
  if(S.parts.length>260)return;
  const ember=Math.random()<.35;
  S.parts.push({x:inc.x+rand(-6,6),y:inc.y+rand(-4,4),vx:rand(-4,10),vy:rand(-26,-12),r:ember?1.6:rand(3,5),gr:ember?0:6,life:ember?.9:1.8,max:ember?.9:1.8,ember});
}
function greenWave(){
  if(!S||S.wave.cd>0||S.paused)return;
  const plus=meta.up.wave;S.wave.on=plus?16:10;S.wave.cd=plus?35:50;
  toast('Green wave','Every light turns green. Vehicles drive 60% faster.','ok');tone(500,.25,'triangle',.05,0,1000);
  renderUI(true);
}
function togglePause(){if(mode!=='play')return;S.paused=!S.paused;renderUI(true);if(S.paused)showPause();else hideOv();}

    <span class="k">Situation</span><span class="v ${c.heard.what?'':'q'}">${c.heard.what?esc(c.tpl.title):'Unknown'}</span>
    <span class="k">Needs</span><span class="v ${kr?'':'q'}">${kr?needs:'Unknown'}</span>`;
  const log=$('#cLog');
  log.innerHTML=c.log.map(m=>`<div class="msg ${m.o?'o':'c'}">${esc(m.text)}</div>`).join('')+(c.pending?'<div class="msg c typing">• • •</div>':'');
  log.scrollTop=log.scrollHeight;
  const cpr=$('#cpr');
  if(c.cpr&&c.cpr.on){cpr.hidden=false;$('#cprPips').innerHTML=Array.from({length:6},(_,i)=>`<i class="${i<c.cpr.res.length?(c.cpr.res[i]?'h':'m'):''}"></i>`).join('');}
  else cpr.hidden=true;
  const opts=callOptions(c);
  $('#cOpts').innerHTML=opts.map((o,i)=>`<button type="button" class="opt ${o.adv?'adv':''}" data-act="ask" data-arg="${o.id}" ${c.pending?'disabled':''}><span class="kbd">${i+1}</span><span>${esc(o.q)}</span></button>`).join('');
  const bs=$('#bSend');bs.disabled=!!c.pending||!c.heard.addr||!!(c.cpr&&c.cpr.on);
  bs.title=c.heard.addr?'':'Ask for the address first';
  $('#bHang').disabled=!!c.pending;
}
function renderUI(force){
  if(!S)return;
  if(force)lastSig={};
  renderTop();renderIncList();renderRadio();renderUnits();renderInc();renderLines();
  if(S.active){const c=S.active;$('#cLine').textContent=`Line ${c.line} · ${Math.floor(c.talk/60)}:${String(Math.floor(c.talk%60)).padStart(2,'0')}`;}
}
function toast(title,sub,kind='info',ms=3600){
  const box=$('#toasts');while(box.children.length>=4)box.firstChild.remove();
  const k={ok:'var(--ok)',bad:'var(--bad)',warn:'var(--warn)',hint:'var(--police)',info:'var(--line-2)'}[kind]||'var(--line-2)';
  const d=document.createElement('div');d.className='toast';d.style.setProperty('--k',k);
  d.innerHTML=`<b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}`;box.appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),320);},ms);
}

/* pointerdown activation so buttons inside fast-refreshing panels never lose a click */
function onAct(root,fn){
  root.addEventListener('pointerdown',e=>{if(e.button!==0)return;const b=e.target.closest('[data-act]');if(!b||b.disabled||!root.contains(b))return;e.preventDefault();audioOn();fn(b.dataset.act,b.dataset.arg);});
  root.addEventListener('click',e=>{if(e.detail!==0)return;const b=e.target.closest('[data-act]');if(!b||b.disabled)return;fn(b.dataset.act,b.dataset.arg);});
}
function act(a,arg){
  if(!S||mode!=='play')return;
  if(a==='sel'){select(+arg,true);document.body.classList.remove('show-left');}
  else if(a==='close')select(null);
  else if(a==='rec')sendRecommended();
  else if(a==='send1'){const u=unitById(arg),inc=incById(S.sel);if(u&&inc){dispatch(u,inc);renderUI(true);}}
  else if(a==='recall'){const u=unitById(arg);if(u){recall(u);renderUI(true);}}
  else if(a==='unit'){const u=unitById(arg);if(u){const p=u.state==='idle'?idlePos(u):u;centerOn(p.x,p.y);if(u.target)select(u.target);document.body.classList.remove('show-right');}}
  else if(a==='answer'){answer(S.calls.find(c=>c.id===arg));renderUI(true);}
  else if(a==='ask')ask(arg);
  else if(a==='send')sendHelp();
  else if(a==='hang'){hangUp();renderUI(true);}
  else if(a==='cpr')cprPress();
}
['#incList','#unitList','#incPanel','#lines','#call'].forEach(s=>onAct($(s),act));

 {id:'P',name:'Patrol car',icon:'P',desc:'Fast. Handles crime, crashes and pursuits.',cost:()=>1500,can:()=>meta.fleet.P<8,own:()=>`${meta.fleet.P} owned`,buy:()=>meta.fleet.P++},

 {id:'F',name:'Fire engine',icon:'F',desc:'Slow but essential for fires, leaks and rescues.',cost:()=>2200,can:()=>meta.fleet.F<7,own:()=>`${meta.fleet.F} owned`,buy:()=>meta.fleet.F++},
 {id:'H',name:'Police helicopter',icon:'heli',desc:'Flies straight over the city. Chases end fast.',cost:()=>5000,can:()=>meta.fleet.H<2,own:()=>`${meta.fleet.H}/2 owned`,buy:()=>meta.fleet.H++},
 {id:'engine',name:'Engine tune-up',icon:'F',desc:'Every vehicle drives 12% faster.',cost:()=>2000*(meta.up.engine+1),can:()=>meta.up.engine<3,own:()=>`Level ${meta.up.engine}/3`,buy:()=>meta.up.engine++},
 {id:'headset',name:'Noise-cancelling headset',icon:'phone',desc:'Callers wait 8 seconds longer before hanging up.',cost:()=>1000,can:()=>!meta.up.headset,own:()=>meta.up.headset?'Owned':'',buy:()=>meta.up.headset=1},

 {id:'wave',name:'Green Wave+',icon:'P',desc:'Green wave lasts 16s instead of 10 and recharges in 35s.',cost:()=>1500,can:()=>!meta.up.wave,own:()=>meta.up.wave?'Owned':'',buy:()=>meta.up.wave=1},
];
const ov=$('#ov');
function hideOv(){ov.hidden=true;ov.innerHTML='';}
function showMenu(){
  mode='menu';ov.hidden=false;
  ov.innerHTML=`<div class="card">
    <span class="badge911">911</span>
    <div class="big">DISPATCH<br><em>RUSH</em></div>
    <p class="tag">You are the night-and-day voice of the Ashford Emergency Line. Phones ring, the city burns a little, a llama escapes. Keep calm, ask the right questions and get the right trucks to the right street.</p>
    <ol class="how">
      <li><b>Answer the phone.</b> Lines ring at the bottom of the screen. Callers hang up if you leave them waiting.</li>
      <li><b>Ask questions.</b> Get the address and what happened. Extra questions reveal hidden needs. Fake street names mean a prank.</li>
      <li><b>Dispatch.</b> Click the incident and send police, fire or medics before the timer ring runs out.</li>
    </ol>
    <div class="row">
      ${hasSave?`<button class="btn primary lg" type="button" data-m="cont">Continue: day ${meta.day}</button><button class="btn lg" type="button" data-m="new">New career</button>`:`<button class="btn primary lg" type="button" data-m="new">Start your first shift</button>`}
    </div>
    <div class="keys">Keys: <span class="kbd">Space</span> answer · <span class="kbd">1</span>–<span class="kbd">9</span> ask · <span class="kbd">Enter</span> send help · <span class="kbd">H</span> hang up on a prank · <span class="kbd">R</span> send recommended · <span class="kbd">G</span> green wave · <span class="kbd">P</span> pause · <span class="kbd">F</span> speed. Drag to pan, scroll to zoom.</div>
  </div>`;
}
function startShift(){
  audioOn();hideOv();newShift();mode='play';
  $('#call').hidden=true;lastSig={};
  renderUI(true);
  toast(`Day ${S.day}: ${S.mod.name}`,S.mod.desc,S.mod.id==='none'?'info':'warn',5000);
}
function grade(st){
  const bad=st.failed+st.missed+st.hung+st.wrong,tot=st.resolved+bad;
  if(!tot)return'–';const r=st.resolved/tot;
  return r>=.95&&st.resolved>=8?'S':r>=.85?'A':r>=.7?'B':r>=.5?'C':'D';
}
function endShift(){
  mode='summary';
  const st=S.stats;closeCall();
  meta.day++;saveMeta();hasSave=true;
  showSummary(st);
}
function showSummary(st){
  ov.hidden=false;
  const g=grade(st),dRep=Math.round(meta.rep-st.rep0);
  ov.innerHTML=`<div class="card">
    <div class="grade">${g}</div>
    <span class="lbl">Shift report · Day ${meta.day-1}</span>
    <h2>${g==='S'?'Flawless shift. The city owes you a coffee.':g==='A'?'Great shift. Ashford sleeps soundly.':g==='B'?'Solid work out there.':g==='C'?'Rough day on the line.':'Ashford had a very bad day.'}</h2>
    <p class="tag" style="margin:0">Rank: <b style="color:var(--text)">${rankOf(meta.resolved)}</b> · ${meta.resolved} incidents resolved in your career.</p>
    <div class="stats">
      <div class="st"><div class="k">Resolved</div><div class="v" style="color:var(--ok)">${st.resolved}</div></div>
      <div class="st"><div class="k">Failed</div><div class="v" style="color:var(--bad)">${st.failed}</div></div>
      <div class="st"><div class="k">Missed calls</div><div class="v">${st.missed}</div></div>
      <div class="st"><div class="k">Pranks caught</div><div class="v">${st.pranks}</div></div>
      <div class="st"><div class="k">Best streak</div><div class="v">${st.best}</div></div>
      <div class="st"><div class="k">Earned</div><div class="v" style="color:var(--amber)">$${st.earned.toLocaleString()}</div></div>
      <div class="st"><div class="k">Reputation</div><div class="v">${Math.round(meta.rep)} <small style="font-size:13px;color:${dRep>=0?'var(--ok)':'var(--bad)'}">${dRep>=0?'+':''}${dRep}</small></div></div>
    </div>
    <h3 class="s">Spend your budget · $${meta.money.toLocaleString()} available</h3>
    <div class="shop">${SHOP.map(it=>{const can=it.can(),cost=it.cost();return`<div class="item"><h4><span class="c${it.icon==='heli'||it.icon==='phone'?'P':it.icon}">${svg(it.icon)}</span>${it.name}</h4><p>${it.desc}</p><div class="ft"><span class="own">${it.own()}</span>${can?`<button class="sbtn go" type="button" data-buy="${it.id}" ${meta.money<cost?'disabled style="opacity:.4"':''}>$${cost.toLocaleString()}</button>`:'<span class="own">Maxed</span>'}</div></div>`;}).join('')}</div>
    <div class="row"><button class="btn primary lg" type="button" data-m="next">Start day ${meta.day}</button><button class="btn lg" type="button" data-m="menu">Main menu</button></div>
  </div>`;
  ov._st=st;
}
function gameOver(){
  mode='over';closeCall();
  const st=S.stats;
  ov.hidden=false;
  ov.innerHTML=`<div class="card"><span class="lbl">Day ${S.day}</span><div class="big">YOU'RE<br><em>FIRED</em></div>
    <p class="tag">Ashford lost faith in its emergency line. The mayor wants to know why the llama is still loose.</p>
    <div class="stats">
      <div class="st"><div class="k">Days survived</div><div class="v">${S.day-1}</div></div>
      <div class="st"><div class="k">Career resolved</div><div class="v">${meta.resolved}</div></div>
      <div class="st"><div class="k">Rank</div><div class="v" style="font-size:16px">${rankOf(meta.resolved)}</div></div>
      <div class="st"><div class="k">This shift</div><div class="v">${st.resolved} / ${st.failed+st.missed+st.hung+st.wrong} bad</div></div>
    </div>
    <div class="row"><button class="btn primary lg" type="button" data-m="new">Start a new career</button></div></div>`;
  try{localStorage.removeItem(STORE);}catch(e){}hasSave=false;
}
function showPause(){
  ov.hidden=false;
  ov.innerHTML=`<div class="card" style="width:min(420px,100%)"><span class="lbl">Paused · ${clockStr()}</span><h2 style="margin:6px 0 16px">Coffee break</h2><div class="row"><button class="btn primary lg" type="button" data-m="resume">Back to the phones</button><button class="btn lg" type="button" data-m="quit">Quit to menu</button></div></div>`;
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;audioOn();
  if(b.dataset.buy){const it=SHOP.find(s=>s.id===b.dataset.buy);if(it&&it.can()&&meta.money>=it.cost()){meta.money-=it.cost();it.buy();saveMeta();sfx.good();showSummary(ov._st);renderTop();}return;}
  const m=b.dataset.m;
  if(m==='new'){meta=freshMeta();saveMeta();hasSave=true;startShift();}
  else if(m==='cont'||m==='next')startShift();
  else if(m==='menu'){S=null;showMenu();renderTop();}
  else if(m==='resume')togglePause();
  else if(m==='quit'){saveMeta();S=null;$('#call').hidden=true;$('#incPanel').hidden=true;$('#lines').innerHTML='';lastSig={};showMenu();renderTop();}
});

/* ---------------------------------------------------------------------
   INPUT
   --------------------------------------------------------------------- */
$('#bPause').onclick=()=>togglePause();
$('#bWave').onclick=()=>greenWave();
$('#bMute').onclick=()=>{muted=!muted;$('#bMute').textContent=muted?'Sound off':'Sound on';audioOn();};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#mtL').onclick=()=>{document.body.classList.toggle('show-left');document.body.classList.remove('show-right');};
$('#mtR').onclick=()=>{document.body.classList.toggle('show-right');document.body.classList.remove('show-left');};
addEventListener('keydown',e=>{
  if(mode!=='play'){if((e.key==='p'||e.key==='P'||e.key==='Escape')&&S&&S.paused)togglePause();return;}
  const k=e.key;audioOn();
  if(S.paused){if(k==='p'||k==='P'||k==='Escape')togglePause();return;}
  if(k===' '){e.preventDefault();if(S.active&&S.active.cpr&&S.active.cpr.on)cprPress();else if(!S.active&&S.calls.length){answer(S.calls[0]);renderUI(true);}}
  else if(/^[1-9]$/.test(k)&&S.active){const o=callOptions(S.active)[+k-1];if(o)ask(o.id);}
  else if(k==='Enter'&&S.active){e.preventDefault();sendHelp();}
  else if((k==='h'||k==='H')&&S.active){hangUp();renderUI(true);}
  else if(k==='r'||k==='R')sendRecommended();
  else if(k==='Escape')select(null);
  else if(k==='p'||k==='P')togglePause();
  else if(k==='g'||k==='G')greenWave();
  else if(k==='f'||k==='F')setSpeed(S.speed%3+1);
});
const ptrs=new Map();let drag=null,pinch=null;
const toWorld=(sx,sy)=>({x:sx/cam.z+cam.x,y:sy/cam.z+cam.y});
function zoomAt(sx,sy,f){const w=toWorld(sx,sy);cam.z=clamp(cam.z*f,.3,3.2);cam.x=w.x-sx/cam.z;cam.y=w.y-sy/cam.z;camTween=null;}
cv.addEventListener('pointerdown',e=>{
  audioOn();cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};drag=null;}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;zoomAt(mx,my,(pinch.z*d/pinch.d)/cam.z);return;}
  if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>5){drag.moved=true;cv.classList.add('drag');}
    if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;camTween=null;}}
});
function endPtr(e){
  const was=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(was&&drag&&!drag.moved&&e.type==='pointerup')mapClick(e.clientX,e.clientY);
  if(!ptrs.size){drag=null;cv.classList.remove('drag');}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015));},{passive:false});
function mapClick(sx,sy){
  if(!S||mode!=='play')return;
  const w=toWorld(sx,sy),k=1/clamp(cam.z,.55,1.7);
  let best=null,bd=1e9;
  for(const inc of S.incidents){if(!live(inc))continue;const d=Math.hypot(inc.x-w.x,inc.y-w.y);if(d<26*k&&d<bd){bd=d;best=inc;}}
  if(best){select(best.id);return;}
  const sel=S.sel&&incById(S.sel);
  for(const u of S.units){const p=u.state==='idle'?idlePos(u):u;if(Math.hypot(p.x-w.x,p.y-w.y)<12*k){
    if(sel&&canSend(u,sel)&&u.state!=='enroute'){dispatch(u,sel);renderUI(true);}
    else toast(u.label,`${UST[u.state]}${u.target&&incById(u.target)?' · '+incById(u.target).title:''}`,'info',2000);
    return;}}
  select(null);
}

/* ---------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='play'&&S&&!S.paused)update(dt);
  draw(now/1000);
  requestAnimationFrame(frame);
}
function boot(data){
  const m=loadMeta();
  if(data&&data.meta){meta=data.meta;hasSave=true;}
  else if(m){meta=m;hasSave=true;}
  else{meta=freshMeta();hasSave=false;}
  resize();fitCam();renderTop();showMenu();
  const go=()=>{mapC=buildMap();};
  let built=false;const once=()=>{if(!built){built=true;go();}};
  (document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(once);
  setTimeout(once,2000);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{resize();});
window.claude?.hot?.snapshot?.(()=>({meta}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
